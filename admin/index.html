<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · Camila Perochena</title><style>body{font:16px system-ui;max-width:900px;margin:3rem auto;padding:0 1rem;color:#191919}input,textarea,select,button{font:inherit;padding:.6rem;margin:.3rem 0;width:100%;box-sizing:border-box}button{width:auto;cursor:pointer}section{border-top:1px solid #ddd;margin-top:2rem;padding-top:1rem}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}@media(max-width:600px){.row{grid-template-columns:1fr}}.hidden{display:none}</style><body><main><h1>Administración</h1><form id="login"><label>Email<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" required></label><label>Código de autenticación<input name="totp" inputmode="numeric" pattern="[0-9]{6}" required></label><button>Entrar</button><p id="error" role="alert"></p></form><div id="panel" class="hidden"><p>Sesión: <span id="who"></span> <button id="logout">Salir</button></p><section><h2>Odisea Argentina</h2><form data-type="videos"><label>URL de YouTube<input name="youtube_id" required></label><label>Título (opcional; se puede completar luego)<input name="title" value="Video de Odisea Argentina"></label><label><input type="checkbox" name="published" value="1"> Publicar</label><button>Agregar columna</button></form><div id="videos"></div></section><section><h2>Libros</h2><form data-type="books" class="row"><label>Título<input name="title" required></label><label>Año<input name="year" type="number" required></label><label>Editorial<input name="publisher" required></label><label>URL externa<input name="external_url" type="url"></label><label><input type="checkbox" name="published" value="1"> Publicado</label><label><input type="checkbox" name="featured_home" value="1"> Destacar en Home</label><button>Guardar libro</button></form><div id="books"></div></section><section><h2>Novedades</h2><form data-type="news" class="row"><label>Tipo<select name="type"><option value="book">Libro</option><option value="conference">Conferencia</option><option value="award">Premio</option><option value="media">Medio</option><option value="other">Otro</option></select></label><label>Fecha<input name="event_date" type="date" required></label><label>Título ES<input name="title_es" required></label><label>Title EN<input name="title_en"></label><label>Descripción ES<textarea name="description_es"></textarea></label><label>Description EN<textarea name="description_en"></textarea></label><label><input type="checkbox" name="published" value="1"> Publicar</label><label><input type="checkbox" name="featured_home" value="1"> Destacar en Home</label><button>Guardar novedad</button></form><div id="news"></div></section></div></main><script>let csrf='';const $=s=>document.querySelector(s);async function api(u,o={}){o.headers={...(o.headers||{}),'content-type':'application/json',...(csrf?{'x-csrf-token':csrf}:{})};let r=await fetch(u,o);if(!r.ok)throw Error((await r.json()).error);return r.status===204?null:r.json()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(t){let rows=await api('/api/admin/'+t);$('#'+t).innerHTML=rows.map(x=>'<p><strong>'+esc(x.title||x.title_es)+'</strong> — '+(x.published?'Publicado':'Borrador')+'</p>').join('')||'<p>Aún no hay elementos.</p>'}$('#login').onsubmit=async e=>{e.preventDefault();try{let d=Object.fromEntries(new FormData(e.target));let r=await api('/api/auth/login',{method:'POST',body:JSON.stringify(d)});csrf=r.csrfToken;$('#who').textContent=r.email;$('#login').classList.add('hidden');$('#panel').classList.remove('hidden');['videos','books','news'].forEach(load)}catch(x){$('#error').textContent=x.message}};document.querySelectorAll('form[data-type]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));for(let k of ['published','featured_home'])d[k]=f.elements[k]?.checked?1:0;try{await api('/api/admin/'+f.dataset.type,{method:'POST',body:JSON.stringify(d)});f.reset();load(f.dataset.type)}catch(x){alert(x.message)}});$('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST',body:'{}'});location.reload()}</script></body></html>
